services:
  postgres:
    image: postgres:16-alpine
    container_name: relax-git-postgres
    environment:
      POSTGRES_DB: relax_git_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - relax-git-network

  redis:
    image: redis:7-alpine
    container_name: relax-git-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - relax-git-network

volumes:
  postgres_data:
  redis_data:

networks:
  relax-git-network:
    driver: bridge
