<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试登录函数 - Relax-Git</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background: #1e1e1e;
      color: #d4d4d4;
    }
    .container {
      background: #252526;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #3e3e42;
    }
    button {
      background: #0e639c;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 4px;
      cursor: pointer;
      margin: 5px;
      font-family: inherit;
    }
    button:hover {
      background: #1177bb;
    }
    pre {
      background: #1e1e1e;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 测试登录函数</h1>
    
    <div>
      <button onclick="testLogin()">测试 Login 函数</button>
      <button onclick="checkStorage()">检查存储</button>
      <button onclick="clearAll()">清理所有</button>
    </div>

    <h3>结果：</h3>
    <pre id="result"></pre>
  </div>

  <script>
    function log(message) {
      const result = document.getElementById('result');
      result.textContent += message + '\n';
      console.log(message);
    }

    function testLogin() {
      document.getElementById('result').textContent = '';
      
      log('=== 开始测试 ===');
      
      // 模拟用户数据
      const testUser = {
        id: 'test-user-123',
        username: 'testuser',
        email: 'test@example.com',
        role: 'USER',
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
      };
      
      const testToken = 'test-access-token-' + Date.now();
      const testRefreshToken = 'test-refresh-token-' + Date.now();
      
      log('测试数据:');
      log(JSON.stringify({ user: testUser, token: testToken, refreshToken: testRefreshToken }, null, 2));
      
      // 直接保存到 localStorage
      log('\n=== 保存到 localStorage ===');
      localStorage.setItem('token', testToken);
      localStorage.setItem('refreshToken', testRefreshToken);
      
      // 保存到 auth-storage（模拟 zustand persist）
      const authStorage = {
        state: {
          user: testUser,
          token: testToken,
          refreshToken: testRefreshToken,
          isAuthenticated: true,
        },
        version: 0
      };
      localStorage.setItem('auth-storage', JSON.stringify(authStorage));
      
      log('✅ 数据已保存');
      
      // 验证
      setTimeout(() => {
        log('\n=== 验证保存结果 ===');
        const savedToken = localStorage.getItem('token');
        const savedRefreshToken = localStorage.getItem('refreshToken');
        const savedAuthStorage = localStorage.getItem('auth-storage');
        
        log('token: ' + (savedToken ? '✅ 存在' : '❌ 不存在'));
        log('refreshToken: ' + (savedRefreshToken ? '✅ 存在' : '❌ 不存在'));
        log('auth-storage: ' + (savedAuthStorage ? '✅ 存在' : '❌ 不存在'));
        
        if (savedAuthStorage) {
          const parsed = JSON.parse(savedAuthStorage);
          log('\nauth-storage 内容:');
          log(JSON.stringify(parsed, null, 2));
        }
      }, 100);
    }

    function checkStorage() {
      document.getElementById('result').textContent = '';
      
      log('=== 当前存储状态 ===\n');
      
      const keys = ['token', 'refreshToken', 'auth-storage', 'debug-register'];
      keys.forEach(key => {
        const value = localStorage.getItem(key);
        if (value) {
          log(`${key}:`);
          try {
            const parsed = JSON.parse(value);
            log(JSON.stringify(parsed, null, 2));
          } catch {
            log(value);
          }
          log('');
        } else {
          log(`${key}: (不存在)\n`);
        }
      });
    }

    function clearAll() {
      localStorage.clear();
      document.getElementById('result').textContent = '✅ 已清理所有数据';
    }
  </script>
</body>
</html>
